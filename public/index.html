<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Logistics Vocabulary Master 700</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Poppins', sans-serif;
        }

        body {
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
            color: #f8fafc;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
        }

        header {
            text-align: center;
            margin-bottom: 25px;
        }

        header h1 {
            font-size: 2.2rem;
            color: #38bdf8;
            margin-bottom: 8px;
        }

        header p {
            color: #94a3b8;
            font-size: 0.95rem;
        }

        .nav-tabs {
            display: flex;
            gap: 12px;
            margin-bottom: 25px;
            background: rgba(30, 41, 59, 0.7);
            padding: 6px;
            border-radius: 12px;
            border: 1px solid #334155;
        }

        .tab-btn {
            background: transparent;
            border: none;
            color: #94a3b8;
            padding: 10px 24px;
            font-size: 1rem;
            font-weight: 600;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .tab-btn.active {
            background-color: #0284c7;
            color: #ffffff;
            box-shadow: 0 4px 12px rgba(2, 132, 199, 0.3);
        }

        .container {
            width: 100%;
            max-width: 650px;
            background: #1e293b;
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.3);
            border: 1px solid #334155;
        }

        .content-section {
            display: none;
        }

        .content-section.active {
            display: block;
        }

        /* Quiz Section Styles */
        .quiz-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding-bottom: 15px;
            border-bottom: 1px solid #334155;
        }

        .score-badge {
            background: #0369a1;
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 0.9rem;
            font-weight: 600;
        }

        .question-card {
            background: #0f172a;
            padding: 25px;
            border-radius: 14px;
            text-align: center;
            margin-bottom: 25px;
            border: 1px solid #334155;
        }

        .question-card h2 {
            color: #f8fafc;
            font-size: 1.5rem;
            word-break: break-word;
        }

        .options-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 12px;
        }

        .option-btn {
            background: #334155;
            border: 2px solid transparent;
            color: #f8fafc;
            padding: 14px 20px;
            border-radius: 12px;
            font-size: 1rem;
            text-align: left;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .option-btn:hover {
            background: #475569;
        }

        .option-btn.correct {
            background: #15803d !important;
            border-color: #22c55e;
            color: #fff;
        }

        .option-btn.wrong {
            background: #b91c1c !important;
            border-color: #ef4444;
            color: #fff;
        }

        .next-btn {
            width: 100%;
            margin-top: 20px;
            padding: 14px;
            background: #0284c7;
            color: #fff;
            border: none;
            border-radius: 12px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            display: none;
        }

        .next-btn:hover {
            background: #0369a1;
        }

        /* Flashcard Section Styles */
        .card-container {
            perspective: 1000px;
            height: 250px;
            cursor: pointer;
            margin-bottom: 20px;
        }

        .flashcard {
            width: 100%;
            height: 100%;
            position: relative;
            transform-style: preserve-3d;
            transition: transform 0.6s cubic-bezier(0.4, 0, 0.2, 1);
            border-radius: 16px;
        }

        .flashcard.flipped {
            transform: rotateY(180deg);
        }

        .card-front, .card-back {
            position: absolute;
            width: 100%;
            height: 100%;
            backface-visibility: hidden;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 20px;
            border-radius: 16px;
            border: 1px solid #334155;
            box-sizing: border-box;
        }

        .card-front {
            background: #0f172a;
            color: #38bdf8;
        }

        .card-back {
            background: #0369a1;
            color: #ffffff;
            transform: rotateY(180deg);
        }

        .card-front h3, .card-back h3 {
            font-size: 1.6rem;
            text-align: center;
        }

        .card-front p {
            color: #64748b;
            font-size: 0.85rem;
            margin-top: 15px;
        }

        .controls {
            display: flex;
            gap: 15px;
            justify-content: center;
        }

        .ctrl-btn {
            background: #334155;
            border: none;
            color: #fff;
            padding: 10px 20px;
            border-radius: 10px;
            cursor: pointer;
            font-weight: 600;
        }

        .ctrl-btn:hover {
            background: #475569;
        }

        /* Dictionary List Styles */
        .search-box {
            width: 100%;
            padding: 12px 16px;
            border-radius: 10px;
            border: 1px solid #334155;
            background: #0f172a;
            color: #fff;
            margin-bottom: 15px;
            font-size: 0.95rem;
        }

        .vocab-list {
            max-height: 380px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .vocab-item {
            background: #0f172a;
            padding: 12px 16px;
            border-radius: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border: 1px solid #334155;
        }

        .vocab-item .en {
            color: #38bdf8;
            font-weight: 600;
        }

        .vocab-item .vi {
            color: #cbd5e1;
        }
    </style>
</head>
<body>

    <header>
        <h1>Logistics Vocabulary</h1>
        <p>Ôn luyện 700+ thuật ngữ Chuyên ngành Logistics & Chuỗi cung ứng</p>
    </header>

    <div class="nav-tabs">
        <button class="tab-btn active" onclick="switchTab('quiz')">Trắc Nghiệm</button>
        <button class="tab-btn" onclick="switchTab('flashcard')">Flashcard</button>
        <button class="tab-btn" onclick="switchTab('list')">Sổ Từ Vựng</button>
    </div>

    <div class="container">
        <!-- Quiz Section -->
        <div id="quiz-section" class="content-section active">
            <div class="quiz-header">
                <span id="question-count" style="color: #94a3b8;">Câu 1/10</span>
                <span class="score-badge" id="score">Điểm: 0</span>
            </div>
            <div class="question-card">
                <h2 id="question-text">Loading...</h2>
            </div>
            <div class="options-grid" id="options-container"></div>
            <button class="next-btn" id="next-btn" onclick="nextQuestion()">Câu Tiếp Theo <i class="fa-solid fa-arrow-right"></i></button>
        </div>

        <!-- Flashcard Section -->
        <div id="flashcard-section" class="content-section">
            <div class="card-container" onclick="flipCard()">
                <div class="flashcard" id="flashcard">
                    <div class="card-front">
                        <h3 id="card-en">Term</h3>
                        <p>(Bấm để xem nghĩa tiếng Việt)</p>
                    </div>
                    <div class="card-back">
                        <h3 id="card-vi">Nghĩa tiếng Việt</h3>
                    </div>
                </div>
            </div>
            <div class="controls">
                <button class="ctrl-btn" onclick="prevCard()"><i class="fa-solid fa-chevron-left"></i> Trước</button>
                <button class="ctrl-btn" onclick="nextCard()">Tiếp <i class="fa-solid fa-chevron-right"></i></button>
            </div>
        </div>

        <!-- Word List Section -->
        <div id="list-section" class="content-section">
            <input type="text" class="search-box" id="search-input" placeholder="Tìm kiếm từ vựng..." oninput="filterVocab()">
            <div class="vocab-list" id="vocab-list-container"></div>
        </div>
    </div>

    <script>
        // Dữ liệu từ vựng Logistics
        const vocabList = [
            { "en": "Bill of Lading (B/L)", "vi": "Vận đơn đường biển" },
            { "en": "Container Yard (CY)", "vi": "Bãi chứa container" },
            { "en": "Freight Forwarder", "vi": "Công ty giao nhận vận tải" },
            { "en": "Customs Clearance", "vi": "Thông quan hải quan" },
            { "en": "Incoterms", "vi": "Điều khoản thương mại quốc tế" },
            { "en": "Certificate of Origin (C/O)", "vi": "Giấy chứng nhận xuất xứ" },
            { "en": "Estimated Time of Arrival (ETA)", "vi": "Thời gian dự kiến đến" },
            { "en": "Estimated Time of Departure (ETD)", "vi": "Thời gian dự kiến đi" },
            { "en": "Warehousing", "vi": "Hoạt động lưu kho" },
            { "en": "Supply Chain Management (SCM)", "vi": "Quản trị chuỗi cung ứng" },
            { "en": "Free on Board (FOB)", "vi": "Giao hàng lên tàu (Miễn phí trên tàu)" },
            { "en": "Cost, Insurance and Freight (CIF)", "vi": "Tiền hàng, bảo hiểm và cước phí" },
            { "en": "Air Waybill (AWB)", "vi": "Vận đơn hàng không" },
            { "en": "Consignee", "vi": "Người nhận hàng" },
            { "en": "Consignor / Shipper", "vi": "Người gửi hàng" },
            { "en": "TEU (Twenty-foot Equivalent Unit)", "vi": "Đơn vị đo container 20 foot" },
            { "en": "FEU (Forty-foot Equivalent Unit)", "vi": "Đơn vị đo container 40 foot" },
            { "en": "Less than Container Load (LCL)", "vi": "Hàng lẻ không đủ container" },
            { "en": "Full Container Load (FCL)", "vi": "Hàng nguyên container" },
            { "en": "Demurrage", "vi": "Phí lưu container tại bãi (cảng)" },
            { "en": "Detention", "vi": "Phí lưu container tại kho riêng" },
            { "en": "Packing List", "vi": "Phiếu đóng gói hàng hóa" },
            { "en": "Commercial Invoice", "vi": "Hóa đơn thương mại" },
            { "en": "Cross Docking", "vi": "Phương pháp phân phối trực tiếp không lưu kho" },
            { "en": "Third-Party Logistics (3PL)", "vi": "Logistics bên thứ ba" },
            { "en": "Fourth-Party Logistics (4PL)", "vi": "Logistics bên thứ tư" },
            { "en": "Multimodal Transport", "vi": "Vận tải đa phương thức" },
            { "en": "Door-to-Door Service", "vi": "Dịch vụ vận chuyển từ kho đến kho" },
            { "en": "Bonded Warehouse", "vi": "Kho ngoại quan" },
            { "en": "Bulk Cargo", "vi": "Hàng rời (không đóng thùng/container)" },
            { "en": "Harmonized System Code (HS Code)", "vi": "Mã phân loại hàng hóa quốc tế" },
            { "en": "Lead Time", "vi": "Thời gian thực hiện (từ đặt hàng đến nhận hàng)" },
            { "en": "Inventory Control", "vi": "Quản lý / Kiểm soát hàng tồn kho" },
            { "en": "Pallet", "vi": "Kệ kê hàng hóa" }
        ];

        let currentQuestion = 0;
        let score = 0;
        let cardIndex = 0;
        let canAnswer = true;

        // Switch Tabs
        function switchTab(tabName) {
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            document.querySelectorAll('.content-section').forEach(sec => sec.classList.remove('active'));

            if (tabName === 'quiz') {
                document.querySelectorAll('.tab-btn')[0].classList.add('active');
                document.getElementById('quiz-section').classList.add('active');
            } else if (tabName === 'flashcard') {
                document.querySelectorAll('.tab-btn')[1].classList.add('active');
                document.getElementById('flashcard-section').classList.add('active');
                showCard();
            } else if (tabName === 'list') {
                document.querySelectorAll('.tab-btn')[2].classList.add('active');
                document.getElementById('list-section').classList.add('active');
                renderVocabList(vocabList);
            }
        }

        // Quiz Logic
        function loadQuestion() {
            canAnswer = true;
            document.getElementById('next-btn').style.display = 'none';
            
            const currentItem = vocabList[currentQuestion % vocabList.length];
            document.getElementById('question-text').innerText = currentItem.en;
            document.getElementById('question-count').innerText = `Câu ${currentQuestion + 1}/${vocabList.length}`;

            // Tạo đáp án đúng + 3 đáp án sai
            let choices = [currentItem.vi];
            while (choices.length < 4 && choices.length < vocabList.length) {
                let randomItem = vocabList[Math.floor(Math.random() * vocabList.length)].vi;
                if (!choices.includes(randomItem)) {
                    choices.push(randomItem);
                }
            }
            choices.sort(() => Math.random() - 0.5);

            const optionsContainer = document.getElementById('options-container');
            optionsContainer.innerHTML = '';
            choices.forEach(choice => {
                const btn = document.createElement('button');
                btn.className = 'option-btn';
                btn.innerText = choice;
                btn.onclick = () => checkAnswer(btn, choice, currentItem.vi);
                optionsContainer.appendChild(btn);
            });
        }

        function checkAnswer(selectedBtn, selectedChoice, correctChoice) {
            if (!canAnswer) return;
            canAnswer = false;

            const allBtns = document.querySelectorAll('.option-btn');
            if (selectedChoice === correctChoice) {
                selectedBtn.classList.add('correct');
                score += 10;
                document.getElementById('score').innerText = `Điểm: ${score}`;
            } else {
                selectedBtn.classList.add('wrong');
                allBtns.forEach(btn => {
                    if (btn.innerText === correctChoice) {
                        btn.classList.add('correct');
                    }
                });
            }

            document.getElementById('next-btn').style.display = 'block';
        }

        function nextQuestion() {
            currentQuestion++;
            loadQuestion();
        }

        // Flashcard Logic
        function showCard() {
            const card = document.getElementById('flashcard');
            card.classList.remove('flipped');
            setTimeout(() => {
                const item = vocabList[cardIndex];
                document.getElementById('card-en').innerText = item.en;
                document.getElementById('card-vi').innerText = item.vi;
            }, 150);
        }

        function flipCard() {
            document.getElementById('flashcard').classList.toggle('flipped');
        }

        function nextCard() {
            cardIndex = (cardIndex + 1) % vocabList.length;
            showCard();
        }

        function prevCard() {
            cardIndex = (cardIndex - 1 + vocabList.length) % vocabList.length;
            showCard();
        }

        // List & Search Logic
        function renderVocabList(list) {
            const container = document.getElementById('vocab-list-container');
            container.innerHTML = '';
            list.forEach(item => {
                const div = document.createElement('div');
                div.className = 'vocab-item';
                div.innerHTML = `<span class="en">${item.en}</span><span class="vi">${item.vi}</span>`;
                container.appendChild(div);
            });
        }

        function filterVocab() {
            const query = document.getElementById('search-input').value.toLowerCase();
            const filtered = vocabList.filter(item => 
                item.en.toLowerCase().includes(query) || item.vi.toLowerCase().includes(query)
            );
            renderVocabList(filtered);
        }

        // Khởi tạo trang web
        window.onload = () => {
            loadQuestion();
        };
    </script>
</body>
</html>
