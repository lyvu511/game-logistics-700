<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đua Top Logistics 700 - Retro Version</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=VT323&display=swap');

        :root { 
            --bg: #2b213a; 
            --card: #241734; 
            --primary: #ff758f; 
            --secondary: #00f5d4; 
            --yellow: #ffee32; 
            --text: #f7f7f7; 
            --border-retro: 3px solid #ffee32;
        }

        body { 
            font-family: 'VT323', monospace, sans-serif; 
            margin: 0; padding: 0; 
            background-color: var(--bg); color: var(--text); 
            font-size: 1.2rem; letter-spacing: 1px;
        }

        header { 
            background: #1e022d; color: var(--yellow); 
            padding: 1rem; text-align: center; 
            font-size: 2rem; border-bottom: 4px solid var(--primary);
            text-shadow: 2px 2px #ff758f;
        }

        .container { 
            max-width: 1200px; margin: 0 auto; padding: 15px; 
            display: grid; grid-template-columns: 1fr 320px; gap: 20px; 
        }

        @media (max-width: 768px) { .container { grid-template-columns: 1fr; } }

        .card { 
            background: var(--card); border: var(--border-retro); 
            padding: 20px; box-shadow: 5px 5px 0px #000; margin-bottom: 20px; 
        }

        .btn { 
            background: var(--secondary); color: #000; 
            border: 2px solid #fff; padding: 10px 15px; 
            font-family: 'VT323', monospace; font-size: 1.3rem;
            cursor: pointer; box-shadow: 3px 3px 0px #000;
        }

        .btn:hover { background: var(--yellow); }

        #auth-modal { 
            position: fixed; inset: 0; background: rgba(15, 5, 29, 0.9); 
            display: flex; align-items: center; justify-content: center; z-index: 1000; 
        }

        .auth-box { 
            background: var(--card); border: 4px solid var(--primary); 
            padding: 30px; max-width: 400px; width: 100%; text-align: center; 
            box-shadow: 8px 8px 0px #000;
        }

        input[type="text"], input[type="email"] { 
            width: 100%; padding: 10px; margin: 10px 0; 
            border: 2px solid var(--secondary); background: #000;
            color: var(--yellow); font-family: 'VT323', monospace; font-size: 1.2rem;
            box-sizing: border-box; 
        }

        .option-btn { 
            display: block; width: 100%; text-align: left; 
            margin: 10px 0; padding: 12px; border: 2px solid var(--primary); 
            background: #1a0f2e; color: var(--text);
            font-family: 'VT323', monospace; font-size: 1.3rem; cursor: pointer; 
            box-shadow: 3px 3px 0px #000;
        }

        .option-btn:hover { background: var(--primary); color: #000; }

        .stats-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; text-align: center; }
        .stat-card { background: #18092b; border: 2px solid var(--secondary); padding: 10px; }
        .stat-card small { color: var(--secondary); font-size: 1.1rem; }
        .stat-card h2 { margin: 5px 0 0 0; font-size: 2rem; }

        #chat-messages { 
            height: 250px; overflow-y: auto; border: 2px solid var(--secondary); 
            background: #000; padding: 10px; margin-bottom: 10px; 
        }
        .msg { margin-bottom: 8px; font-size: 1.1rem; }
        .msg-user { color: var(--yellow); font-weight: bold; }
    </style>
</head>
<body>

<header>🎮 HỆ THỐNG ĐẤU TRÍ LOGISTICS 700 (RETRO)</header>

<!-- Auth Modal -->
<div id="auth-modal">
    <div class="auth-box">
        <h2 style="color: var(--yellow);">ĐĂNG NHẬP GAME</h2>
        <p style="font-size: 1rem; color: var(--secondary);">(Giới hạn 55 người chơi)</p>
        <div id="step-1">
            <input type="text" id="username" placeholder="Tên của bạn...">
            <input type="email" id="useremail" placeholder="Email của bạn...">
            <button class="btn" onclick="requestAccessCode()">VÀO GAME / XIN MÃ</button>
        </div>
        <div id="step-2" style="display:none;">
            <p style="color: var(--secondary);">Mã đã gửi đến Admin (jeikei0511@gmail.com). Hãy nhập mã Admin đọc cho bạn:</p>
            <input type="text" id="access-code" placeholder="Nhập mã 6 số...">
            <button class="btn" onclick="verifyAndLogin()">XÁC NHẬN MÃ</button>
        </div>
    </div>
</div>

<div class="container">
    <div>
        <!-- Stats -->
        <div class="card">
            <div class="stats-grid">
                <div class="stat-card">
                    <small>Số từ cần học</small>
                    <h2>700</h2>
                </div>
                <div class="stat-card">
                    <small>Số từ đã sai</small>
                    <h2 id="wrong-words-count" style="color: #ff477e;">0</h2>
                </div>
                <div class="stat-card">
                    <small>Điểm Bảng Xếp Hạng</small>
                    <h2 id="user-score" style="color: var(--yellow);">0</h2>
                </div>
            </div>
        </div>

        <!-- Quiz Area -->
        <div class="card">
            <div style="display: flex; justify-content: space-between;">
                <span id="topic-title" style="color: var(--secondary);">Chủ đề: Tổng hợp</span>
            </div>
            <h1 id="question-word" style="text-align: center; margin: 30px 0; color: var(--yellow); font-size: 2.5rem;">Loading...</h1>
            <div id="options-container"></div>
        </div>

        <!-- Admin Panel -->
        <div class="card" id="admin-panel" style="display:none; border: 3px solid #ff477e;"></div>
    </div>

    <!-- Sidebar -->
    <div>
        <div class="card">
            <h3 style="margin-top:0; color: var(--yellow);">🏆 BẢNG XẾP HẠNG TOP 55</h3>
            <ol id="leaderboard-list" style="padding-left: 20px;"></ol>
        </div>

        <div class="card">
            <h3 style="margin-top:0; color: var(--yellow);">💬 CHAT CHUNG</h3>
            <div id="chat-messages"></div>
            <div style="display: flex; gap: 5px;">
                <input type="text" id="chat-input" placeholder="Chat..." style="margin:0;">
                <button class="btn" onclick="sendMessage()">GỬI</button>
            </div>
        </div>
    </div>
</div>

<script>
    const vocabularyList = [
        { word: "Export", meaning: "Xuất khẩu", topic: "Xuất nhập khẩu" },
        { word: "Importer", meaning: "Người nhập khẩu", topic: "Xuất nhập khẩu" },
        { word: "Customs clearance", meaning: "Thông quan", topic: "Hải quan" },
        { word: "Bill of Lading (BL)", meaning: "Vận đơn đường biển", topic: "Chứng từ" },
        { word: "FOB - Free On Board", meaning: "Giao hàng lên tàu", topic: "Incoterms" },
        { word: "CIF", meaning: "Tiền hàng, bảo hiểm và cước phí", topic: "Incoterms" },
        { word: "Bonded warehouse", meaning: "Kho ngoại quan", topic: "Kho vận" },
        { word: "Freight forwarder", meaning: "Hãng giao nhận vận tải", topic: "Vận chuyển" },
        { word: "Consignee", meaning: "Người nhận hàng", topic: "Vận chuyển" },
        { word: "Container Yard - CY", meaning: "Bãi container", topic: "Kho vận" }
    ];

    let currentUser = null;
    let wrongWords = [];
    let currentScore = 0;
    let currentQuestion = null;

    function requestAccessCode() {
        const name = document.getElementById('username').value;
        const email = document.getElementById('useremail').value.trim();
        if (!name || !email) return alert("Vui lòng điền tên và email!");

        fetch('/api/request-code', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({ name, email })
        })
        .then(res => res.json())
        .then(data => {
            if (data.isAdmin) {
                currentUser = { name, email, isAdmin: true };
                document.getElementById('auth-modal').style.display = 'none';
                document.getElementById('admin-panel').style.display = 'block';
                initAdminDashboard();
                initGame();
            } else {
                document.getElementById('step-1').style.display = 'none';
                document.getElementById('step-2').style.display = 'block';
            }
        });
    }

    function verifyAndLogin() {
        const code = document.getElementById('access-code').value;
        const email = document.getElementById('useremail').value.trim();
        const name = document.getElementById('username').value;

        fetch('/api/verify-code', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({ email, code })
        })
        .then(res => res.json())
        .then(data => {
            if (data.success) {
                currentUser = { name, email, isAdmin: false };
                document.getElementById('auth-modal').style.display = 'none';
                initGame();
            } else {
                alert(data.message || "Mã không đúng!");
            }
        });
    }

    function initAdminDashboard() {
        setInterval(() => {
            if (!currentUser || !currentUser.isAdmin) return;
            fetch(`/api/admin/data?email=${currentUser.email}`)
            .then(res => res.json())
            .then(data => {
                let pendingHTML = '<h3 style="color:#ff477e; margin-top:0;">MÃ ĐANG CHỜ CẤP MỚI:</h3><ul>';
                data.pendingList.forEach(item => {
                    pendingHTML += `<li><b>${item.name}</b> (${item.email}) - Mã: <span style="color:var(--yellow); font-size:1.5rem;">${item.code}</span></li>`;
                });
                pendingHTML += '</ul>';

                let activeHTML = '<h3 style="color:var(--secondary);">THÀNH VIÊN TRONG PHÒNG (TỐI ĐA 55):</h3><ul>';
                data.activeList.forEach(item => {
                    activeHTML += `<li>${item.name} (${item.email}) `;
                    if (item.role !== 'admin') {
                        activeHTML += `<button onclick="kickUser('${item.email}')" class="btn" style="padding:2px 5px; font-size:0.9rem; background:#ff477e; color:#fff;">Kích</button>`;
                    } else {
                        activeHTML += `<i>(Admin)</i>`;
                    }
                    activeHTML += `</li>`;
                });
                activeHTML += '</ul>';

                document.getElementById('admin-panel').innerHTML = pendingHTML + activeHTML;
            });
        }, 2000);
    }

    function kickUser(targetEmail) {
        fetch('/api/admin/kick', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({ adminEmail: currentUser.email, targetEmail })
        }).then(() => alert("Đã kích thành công!"));
    }

    function loadNextQuestion() {
        const randIndex = Math.floor(Math.random() * vocabularyList.length);
        currentQuestion = vocabularyList[randIndex];
        
        document.getElementById('question-word').innerText = currentQuestion.word;
        document.getElementById('topic-title').innerText = `Chủ đề: ${currentQuestion.topic}`;

        const optionsContainer = document.getElementById('options-container');
        optionsContainer.innerHTML = '';

        let options = [currentQuestion.meaning];
        while (options.length < 4) {
            let randomMeaning = vocabularyList[Math.floor(Math.random() * vocabularyList.length)].meaning;
            if (!options.includes(randomMeaning)) options.push(randomMeaning);
        }
        options.sort(() => Math.random() - 0.5);

        options.forEach(opt => {
            const btn = document.createElement('button');
            btn.className = 'option-btn';
            btn.innerText = opt;
            btn.onclick = () => checkAnswer(opt);
            optionsContainer.appendChild(btn);
        });
    }

    function checkAnswer(selected) {
        if (selected === currentQuestion.meaning) {
            currentScore += 10;
            alert("CHÍNH XÁC! +10 ĐIỂM");
        } else {
            wrongWords.push(currentQuestion);
            document.getElementById('wrong-words-count').innerText = wrongWords.length;
            alert(`SAI RỒI! Đáp án đúng là: ${currentQuestion.meaning}`);
        }
        document.getElementById('user-score').innerText = currentScore;
        loadNextQuestion();
    }

    function sendMessage() {
        const input = document.getElementById('chat-input');
        if (!input.value) return;
        const msgBox = document.getElementById('chat-messages');
        msgBox.innerHTML += `<div class="msg"><span class="msg-user">${currentUser.name}:</span> ${input.value}</div>`;
        input.value = '';
        msgBox.scrollTop = msgBox.scrollHeight;
    }

    function initGame() {
        loadNextQuestion();
    }
</script>
</body>
</html>
